name: Release

# Publishes to npm with provenance through npm trusted publishing (OIDC):
# no token is stored in this repository. Tag a commit on main as vX.Y.Z whose
# package.json version is X.Y.Z.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@11
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Skip a version already on npm
        id: published
        run: echo "exists=$(npm view "origingame@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1 && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.exists == 'no'
        run: npm ci
      - if: steps.published.outputs.exists == 'no'
        run: npm publish --provenance --access public
